version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - dupl
    - errcheck
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gocritic
    - gomodguard_v2
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unused
    - nolintlint
  settings:
    depguard:
      rules:
        all:
          files:
            - $all
          deny:
            - pkg: github.com/magiconair/properties/assert
              desc: Use testify/assert package instead
        main:
          files:
            - '!$test'
          deny:
            - pkg: github.com/davecgh/go-spew/spew
              desc: spew is usually only used in tests
            - pkg: github.com/stretchr/testify
              desc: testify is usually only used in tests
    dupl:
      threshold: 100
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      min-complexity: 10
    gomodguard_v2:
      blocked:
        - module: gopkg.in/go-playground/assert.v1
          recommendations:
            - github.com/stretchr/testify
          reason: testify is the test assertion framework we use
        - module: github.com/pborman/uuid
          recommendations:
            - github.com/google/uuid
    misspell:
      locale: US
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - errcheck
          - gochecknoglobals
          - gochecknoinits
          - gocyclo
          - gosec
        path: _test\.go
      - linters:
          - gochecknoglobals
          - gochecknoinits
        path: cmd
      - linters:
          - lll
        source: '^//go:generate '
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  new: false
  fix: true
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
